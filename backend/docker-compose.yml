version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: dealwise_db
      POSTGRES_USER: dealwise_user
      POSTGRES_PASSWORD: dealwise_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://dealwise_user:dealwise_password@postgres:5432/dealwise_db
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data: