<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.jpg?v=1" type="image/jpeg" />
    <title>DealWise - Smart Deals & Price Comparison</title>
    <meta
      name="description"
      content="Compare prices across multiple platforms, track promotions, and discover the best deals with intelligent analysis and real-time insights."
    />
    <meta name="author" content="DealWise" />

    <!-- Canonical is set per-route via react-helmet-async in src/components/SEO.tsx -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <meta
      property="og:title"
      content="DealWise - Smart Deals & Price Comparison"
    />
    <meta
      property="og:description"
      content="Compare prices across multiple platforms, track promotions, and discover the best deals with intelligent analysis and real-time insights."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://dealwisewisdomindeals.lovable.app"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DealWise",
        "url": "https://dealwisewisdomindeals.lovable.app",
        "description": "Smart price comparison and deal discovery platform for Indian shoppers."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DealWise",
        "url": "https://dealwisewisdomindeals.lovable.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://dealwisewisdomindeals.lovable.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
